<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rosa eterna</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene">
      <section class="bottle" aria-label="Rosa en frasco">
        <div class="bottle__glass">
          <div class="bottle__shine"></div>
          <div class="rose">
            <div class="rose__bloom">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <div class="rose__stem"></div>
            <div class="rose__leaf rose__leaf--left"></div>
            <div class="rose__leaf rose__leaf--right"></div>
          </div>
          <div class="petal petal--1"></div>
          <div class="petal petal--2"></div>
          <div class="petal petal--3"></div>
          <div class="petal petal--4"></div>
          <div class="petal petal--5"></div>
        </div>
        <div class="bottle__base"></div>
      </section>

      <section class="message">
        <p>Mi amor por ti durará hasta que caiga el último pétalo</p>
        <span class="heart" aria-hidden="true">❤</span>
      </section>
    </main>
  </body>
</html>
